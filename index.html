/* ДИЗАЙН-ТОКЕНЫ — единственное место, где живут значения дизайна.

/* ===== Liquid Glass redesign ===== */
body{max-width:760px;margin:0 auto;position:relative}
body::before,body::after{content:'';position:fixed;z-index:-1;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);pointer-events:none;transition:background 1s}
body::before{top:-22vmax;left:-18vmax;background:hsl(var(--h) 80% 45%/calc(.5*var(--bgi)));animation:drift 22s ease-in-out infinite alternate}

html.noanim body::before,html.noanim body::after{animation:none}

.g{background:radial-gradient(130% 90% at 0% 0%,rgba(255,255,255,calc(var(--ga)*3)),transparent 55%),linear-gradient(135deg,rgba(255,255,255,calc(var(--ga)*1.7)),rgba(255,255,255,calc(var(--ga)*.5)));backdrop-filter:blur(var(--bl)) saturate(1.8) brightness(1.08);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.8) brightness(1.08);border:1px solid var(--white-16);box-shadow:inset 0 1.5px 0 var(--white-42),inset 0 -1px 0 var(--white-7),inset 0 0 22px var(--white-5),0 14px 34px -14px var(--black-55)}

main{padding:calc(20px + env(safe-area-inset-top,0px)) 14px 14px}
h2{text-align:center;font-weight:900;font-size:var(--fs-34);letter-spacing:.2px;text-shadow:0 2px 14px var(--black-35)}
main>*{animation:rise .6s var(--ease) both}main>:nth-child(2){animation-delay:.05s}main>:nth-child(3){animation-delay:.1s}main>:nth-child(4){animation-delay:.15s}main>:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
.bt{background:linear-gradient(180deg,var(--white-20),var(--white-7));backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid var(--white-18);box-shadow:inset 0 1.5px 0 var(--white-40),0 6px 16px -8px var(--black-50);font-weight:700;transition:transform .35s var(--spring),box-shadow .3s,background .3s}
.bt:hover{transform:translateY(-1px)}.bt:active,.ic:active,.nb:active{transform:scale(.9)}
.bt.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac));border-color:var(--white-35);box-shadow:inset 0 1.5px 0 var(--white-50),0 8px 22px -6px var(--ac)}
input[type=text],input[type=search],input[type=password],select,textarea{background:linear-gradient(180deg,var(--white-14),var(--white-6));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--white-16);box-shadow:inset 0 1.5px 0 var(--white-25);transition:box-shadow .3s,transform .3s var(--spring)}

input[type=range]::-webkit-slider-runnable-track{height:8px;background:linear-gradient(180deg,var(--black-25),var(--white-14));box-shadow:inset 0 1px 3px var(--black-40)}

new ResizeObserver(()=>document.documentElement.style.setProperty('--bh',($('#bar').offsetHeight+$('#nav').offsetHeight+34)+'px')).observe(document.body);
boot();
</script>
